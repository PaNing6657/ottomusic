<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谱面编辑器</title>
<link rel="stylesheet" href="/css/editor.css">
</head>
<body>

<header class="toolbar">
  <div class="brand">
    <div class="logo">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="#fff"><path d="M4 2.5v11L13 8z"/></svg>
    </div>
    <div class="brand-text">
      <span class="title">MAP EDITOR</span>
      <span class="title-cn">谱面编辑器</span>
    </div>
  </div>

  <div class="tool-group">
    <input id="mapName" class="input" type="text" value="未命名谱面" spellcheck="false" title="谱面名称">
    <div class="field">
      <label>BPM</label>
      <input id="bpmInput" class="input num" type="number" value="120" min="40" max="300" step="0.1">
    </div>
    <button id="bpmDetect" class="btn ghost" title="根据音频自动估算 BPM">自动检测</button>
    <div class="field">
      <label>吸附</label>
      <select id="snapSelect" class="input select">
        <option value="0">关</option>
        <option value="1">1/1</option>
        <option value="2">1/2</option>
        <option value="4" selected>1/4</option>
        <option value="8">1/8</option>
        <option value="16">1/16</option>
        <option value="32">1/32</option>
      </select>
    </div>
    <div class="field">
      <label>轨道</label>
      <select id="laneCountSelect" class="input select" title="轨道数 2~8">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <button id="keybindBtn" class="btn ghost" title="自定义键位绑定">⌨ 键位</button>
  </div>

  <div class="tool-group">
    <button id="zoomOut" class="btn" title="缩小 (Ctrl+-)">−</button>
    <span id="zoomLabel" class="zoom-label">×1.0</span>
    <button id="zoomIn" class="btn" title="放大 (Ctrl+=)">＋</button>
    <label class="checkbox"><input id="followPlay" type="checkbox" checked>跟随</label>
  </div>

  <div class="tool-group play-group">
    <button id="recordBtn" class="btn record" title="实时录制 (R)：播放中按轨道键自动生成音符">⏺ 录制</button>
    <button id="playBtn" class="btn primary" title="空格">▶ 播放</button>
    <button id="stopBtn" class="btn" title="停止">■</button>
    <span id="timeLabel" class="time-label">0:00.000 / 0:00</span>
  </div>

  <div class="tool-group">
    <button id="saveBtn" class="btn primary" title="Ctrl+S">💾 保存</button>
    <button id="playtestBtn" class="btn accent" title="在游戏页试玩当前谱面">🎮 试玩</button>
    <button id="listBtn" class="btn ghost">谱面库</button>
  </div>
</header>

<main id="editorWrap" class="editor-wrap">
  <!-- 录制中提示条 -->
  <div id="recBar" class="rec-bar hidden">
    <span class="rec-dot">⏺</span> <b>录制中</b>
    <span class="rec-tip">按轨道键打点 · 长按生成 HOLD · 空格结束 · Esc 撤销本次录制</span>
    <span id="recCount" class="rec-count">已录 0 音符</span>
  </div>

  <!-- 横向滚动区 -->
  <div id="scrollArea" class="scroll-area">
    <!-- 左侧固定标签列（轨道标签由 JS 动态生成） -->
    <div class="lane-labels">
      <div class="row-label ruler-label">时间</div>
      <div class="row-label wave-label">波形</div>
      <div id="laneLabels" class="lane-label-slot"></div>
    </div>

    <!-- 内容区 -->
    <div id="content" class="content">
      <!-- 统一网格图层（贯穿标尺以下所有行） -->
      <div id="gridLayer" class="grid-layer"></div>
      <div id="rulerRow" class="row ruler-row"></div>
      <div class="row wave-row"><canvas id="waveCanvas" height="72"></canvas></div>
      <div id="laneRows" class="lane-rows"></div>
      <!-- 播放头 -->
      <div id="playhead" class="playhead"></div>
    </div>
  </div>
</main>

<footer class="statusbar">
  <span id="statusNotes">音符: 0</span>
  <span id="statusTime">时间: 0.000s</span>
  <span id="statusHint">点击轨道放置音符 · 拖动移动 · 右键删除 · 空格播放/暂停 · Ctrl+滚轮缩放</span>
  <span id="saveState" class="save-state">未保存</span>
</footer>

<!-- 谱面库弹窗 -->
<div id="mapListModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>谱面库</span>
      <button id="modalClose" class="btn ghost">✕</button>
    </div>
    <div class="modal-body">
      <button id="newMapBtn" class="btn primary block">＋ 新建谱面</button>
      <ul id="mapList" class="map-list"></ul>
    </div>
  </div>
</div>

<!-- 键位绑定弹窗 -->
<div id="keybindModal" class="modal hidden">
  <div class="modal-box keybind-box">
    <div class="modal-head">
      <span>键位绑定</span>
      <button id="keybindClose" class="btn ghost">✕</button>
    </div>
    <div class="modal-body">
      <p class="keybind-tip">点击键槽后按下新按键完成绑定 · Esc 取消 · 重复按键自动从原轨道移除</p>
      <div id="keybindRows" class="keybind-rows"></div>
      <button id="keybindReset" class="btn ghost block">↺ 恢复默认键位</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/editor.js"></script>
</body>
</html>
